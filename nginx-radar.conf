# Nginx Configuration for Radar (например, radar.profipass.ru или radar.yourdomain.com)
# Разместить в: /etc/nginx/sites-available/radar.conf
# Активировать: ln -s /etc/nginx/sites-available/radar.conf /etc/nginx/sites-enabled/
# Настроить SSL сертификат через Certbot:
#   certbot --nginx -d radar.yourdomain.com
# Проверить: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name radar.profipass.ru; # Укажите ваш домен

    # Редирект на HTTPS настраивается certbot автоматически:
    # return 301 https://$host$request_uri;

    location / {
        # Порт должен совпадать с RADAR_HOST_PORT в .env (по умолчанию 8787)
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }
}

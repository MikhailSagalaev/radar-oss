<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong>Radar</strong>
    <span>добавление заказов</span>
  </header>

  <div id="preview-box" class="preview-box">
    <div id="page-title" class="page-title">Загрузка...</div>
    <div id="page-url" class="page-url"></div>
  </div>

  <div class="type-selector">
    <label class="radio-label">
      <input type="radio" name="leadType" value="gig" id="type-gig" checked>
      <span>Заказ</span>
    </label>
    <label class="radio-label">
      <input type="radio" name="leadType" value="job" id="type-job">
      <span>Вакансия</span>
    </label>
  </div>

  <div class="actions-box">
    <button id="send" type="button">Отправить в Radar</button>
  </div>
  <p id="status" class="status"></p>

  <details id="settings-details">
    <summary>Настройки сервера</summary>
    <form id="config">
      <label>Ваш никнейм (@telegram)
        <input id="contributor" type="text" placeholder="@username">
      </label>
      <label>Адрес сервера Radar
        <input id="base" type="url" placeholder="http://127.0.0.1:8787" required>
      </label>
      <label>ID источника
        <input id="sourceId" type="text" placeholder="ID источника" required>
      </label>
      <label>Токен источника
        <input id="token" type="password" placeholder="Секретный токен" required>
      </label>
      <button type="submit" class="ghost">Сохранить</button>
    </form>
  </details>

  <script src="popup.js"></script>
</body>
</html>

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_secure_db_password_2026
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 5

  radar:
    build: .
    container_name: radar_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8791:8787"
    environment:
      - DATABASE_URL=postgres://radar:radar_secure_db_password_2026@postgres:5432/radar
      - PORT=8787
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./data:/app/data

volumes:
  radar_pgdata:

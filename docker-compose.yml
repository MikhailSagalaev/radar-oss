services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: radar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - radar_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  radar:
    build: .
    container_name: radar_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RADAR_HOST_PORT:-8787}:8787"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - PORT=8787
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./data:/app/data

volumes:
  radar_pgdata:
